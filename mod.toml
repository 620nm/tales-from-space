# Tales from Space — mod manifest, read before the round's script host
# evaluates content (docs/SCRIPTING.md §5.1 identity, §7.2 loading).
# The id is
# vendor/mod — the vendor is the authoring group, which shares its name
# with the engine; the word "lunatic" otherwise names the engine only.

[mod]
id = "lunatic/tfs"
name = "Tales from Space"
version = "0.1.0"
api_version = 1
requires = []
optional = []
native_edges = [
    "movement.bump",
    "interaction.use",
    "interaction.act",
    "attack.swing",
    "entity.pull",
    "throw.land",
    "matter.rupture",
    "matter.ignition",
    "matter.extinguished",
    "body.threshold",
    "part.seat",
    "part.unseat",
    "procedure.start",
    "procedure.operate",
    "lifecycle.mob",
    "lifecycle.round_start",
    "lifecycle.round_end",
    "parts.refresh",
    "component.command",
    "speech.radio",
]

[paths]
content = "content"
maps = "maps"
# The station a host boots when its command line names no map.
map = "maps/chillstation.ron"
assets = "assets"
tests = "tests"

[permissions]
replace_handlers = true
prototype_handlers = true
global_handlers = true
notify_private = true
notify_audience = true

[notifications]
sender = "Charter Command"
channel = "Common"
